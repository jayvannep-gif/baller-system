<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BASKETBALL CLUB SYSTEM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #0f172a;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 12px; }
        .hidden { display: none !important; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .tag {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .badge-paid { background: var(--accent-green); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .badge-unpaid { background: var(--accent-red); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }

        .btn-main { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        
        .btn-add-a { background: #2563eb; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .btn-add-b { background: #dc2626; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .btn-remove { background: #475569; color: white; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }

        .scrollable-container { max-height: 300px; overflow-y: auto; padding-right: 4px; }
        .scrollable-container::-webkit-scrollbar { width: 6px; }
        .scrollable-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPoQ-8anpEqtozvXlJCoaxl3hOv4E5uIg",
            authDomain: "ballerapp-61517.firebaseapp.com",
            projectId: "ballerapp-61517",
            storageBucket: "ballerapp-61517.firebasestorage.app",
            messagingSenderId: "653164120828",
            appId: "1:653164120828:web:a1b24c6082b14adbfb6579"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const SUPER_ADMIN_EMAIL = "jayvannep@gmail.com";
        const DEFAULT_GUEST_AVATAR = "https://ui-avatars.com/api/?name=Guest&background=334155&color=fff";
        
        let currentUserData = null;
        let isAdminUser = false;
        let customMatchesData = {}; 
        let globalAttendingPool = []; 

        window.navigateTo = (pageId) => {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            const target = document.getElementById(pageId);
            if (target) target.classList.remove('hidden');
        };

        window.loginWithGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                checkUserStatus(result.user);
            } catch (err) {
                alert("Login Failed: " + err.message);
            }
        };

        window.logout = () => signOut(auth).then(() => location.reload());

        async function checkUserStatus(user) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                currentUserData = userSnap.data();
                if (currentUserData.isBanned && user.email !== SUPER_ADMIN_EMAIL) {
                    alert("ACCOUNT RESTRICTED: " + (currentUserData.banReason || "Violated club policies."));
                    logout();
                    return;
                }
                if (!currentUserData.isApproved && user.email !== SUPER_ADMIN_EMAIL) {
                    window.navigateTo('pending-approval-page');
                    return;
                }
                window.navigateTo('dashboard-page');
                checkRoles(user.email);
            } else {
                window.navigateTo('signup-page');
            }
        }

        async function checkRoles(email) {
            isAdminUser = false;
            if (email === SUPER_ADMIN_EMAIL) {
                isAdminUser = true;
            } else {
                const adminSnap = await getDoc(doc(db, "admins", email));
                if (adminSnap.exists()) isAdminUser = true;
            }

            const adminNavBtn = document.getElementById('admin-nav-btn');
            if (isAdminUser && adminNavBtn) {
                adminNavBtn.classList.remove('hidden');
            }
            renderGameSets();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                checkUserStatus(user);
            } else {
                window.navigateTo('login-page');
            }
            loadRealtimeData();
        });

        function loadRealtimeData() {
            onSnapshot(doc(db, "settings", "custom_matches"), (docSnap) => {
                if (docSnap.exists()) {
                    customMatchesData = docSnap.data() || {};
                } else {
                    customMatchesData = {};
                }
                renderGameSets();
            });

            onSnapshot(collection(db, "users"), (snapshot) => {
                let attendingPool = [];
                snapshot.forEach(docSnap => {
                    const u = docSnap.data();
                    const isSuperAdmin = (u.email === SUPER_ADMIN_EMAIL);
                    const isEligible = (u.isApproved || isSuperAdmin) && !u.isBanned;

                    if (u.status === 'in' && isEligible) {
                        attendingPool.push({ uid: u.uid, name: u.name, position: u.position || 'PG', isPaid: u.isPaid });
                        if (u.guests && u.guests.length > 0) {
                            u.guests.forEach(gName => {
                                attendingPool.push({ uid: u.uid, name: `${gName} (${u.name}'s Guest)`, position: 'GUEST', isPaid: u.isPaid });
                            });
                        }
                    }
                });
                globalAttendingPool = attendingPool;
                renderActiveRosterList();
                renderGameSets();
            });
        }

        function getAbbrPos(posStr) {
            if (!posStr) return "[N/A]";
            if (posStr === "GUEST") return "[GUEST]";
            const match = posStr.match(/\(([^)]+)\)/);
            return match ? `[${match[1]}]` : `[${posStr}]`;
        }

        function renderActiveRosterList() {
            const rosterList = document.getElementById('active-roster-list');
            if (!rosterList) return;

            rosterList.innerHTML = globalAttendingPool.length === 0 ? `<li style="color:var(--text-muted); list-style:none;">No players checked in yet.</li>` :
                globalAttendingPool.map(p => `
                    <li style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; background:#1e293b; padding:6px 10px; border-radius:6px;">
                        <span><strong>${p.name}</strong> <span style="color:#60a5fa; font-size:0.75rem;">${getAbbrPos(p.position)}</span></span>
                        ${p.isPaid ? `<span class="badge-paid">PAID</span>` : `<span class="badge-unpaid">UNPAID</span>`}
                    </li>
                `).join('');
        }

        function renderGameSets() {
            const container = document.getElementById('generated-matches');
            if (!container) return;
            container.innerHTML = "";

            // Render 4 Game Sets for Admin Building
            for (let gameNum = 1; gameNum <= 4; gameNum++) {
                const gameKey = `game_${gameNum}`;
                const gameData = customMatchesData[gameKey] || { teamA: [], teamB: [] };

                const teamA = gameData.teamA || [];
                const teamB = gameData.teamB || [];

                const renderPlayerItem = (p) => {
                    const nameStr = p.name || p;
                    const posStr = p.position ? getAbbrPos(p.position) : '';
                    return `
                        <li style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <span><strong>${nameStr}</strong> <span style="color:#60a5fa; font-size:0.75rem;">${posStr}</span></span>
                            ${isAdminUser ? `<button class="btn-remove" onclick="removePlayerFromGame(${gameNum}, '${nameStr}')">✕</button>` : ''}
                        </li>
                    `;
                };

                // Admin In/Out Picker Panel
                let adminPickerHtml = "";
                if (isAdminUser) {
                    let availablePlayers = globalAttendingPool.map(p => {
                        const inTeamA = teamA.some(ta => ta.name === p.name);
                        const inTeamB = teamB.some(tb => tb.name === p.name);

                        return `
                            <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:4px 8px; border-radius:4px; margin-bottom:4px; font-size:0.8rem;">
                                <span>${p.name} <span style="color:#60a5fa; font-size:0.7rem;">${getAbbrPos(p.position)}</span></span>
                                <div style="display:flex; gap:4px;">
                                    ${!inTeamA ? `<button class="btn-add-a" onclick="addPlayerToTeam(${gameNum}, '${p.name}', '${p.position}', 'A')">+ Team A</button>` : ''}
                                    ${!inTeamB ? `<button class="btn-add-b" onclick="addPlayerToTeam(${gameNum}, '${p.name}', '${p.position}', 'B')">+ Team B</button>` : ''}
                                    ${(inTeamA || inTeamB) ? `<button class="btn-remove" onclick="removePlayerFromGame(${gameNum}, '${p.name}')">Out</button>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');

                    adminPickerHtml = `
                        <details style="margin-top:10px; background:#1e293b; padding:8px; border-radius:6px;">
                            <summary style="font-size:0.8rem; font-weight:bold; cursor:pointer; color:var(--accent-blue);">⚙️ Admin: Select / In-Out Players for Game ${gameNum} (${teamA.length + teamB.length}/10)</summary>
                            <div style="margin-top:8px; max-height:180px; overflow-y:auto;">
                                ${availablePlayers || '<p style="font-size:0.75rem; color:var(--text-muted);">No attending players found.</p>'}
                            </div>
                            <div style="margin-top:8px; display:flex; gap:6px;">
                                <input type="text" id="custom-borrow-${gameNum}" placeholder="Or type manual/borrowed name..." style="margin:0; flex:1; font-size:0.75rem; padding:4px 6px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:4px;">
                                <button class="btn-add-a" onclick="addManualPlayer(${gameNum}, 'A')">+ A</button>
                                <button class="btn-add-b" onclick="addManualPlayer(${gameNum}, 'B')">+ B</button>
                            </div>
                        </details>
                    `;
                }

                let card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #334155; padding-bottom:6px;">
                        <span class="tag">GAME ${gameNum}</span>
                        <span style="font-size:0.8rem; font-weight:bold; color:${(teamA.length === 5 && teamB.length === 5) ? '#22c55e' : '#f59e0b'};">
                            ${(teamA.length === 5 && teamB.length === 5) ? 'READY (5 vs 5)' : `BUILDING (${teamA.length + teamB.length}/10)`}
                        </span>
                    </div>

                    <div class="grid-2">
                        <div style="background:#1e293b; padding:8px; border-radius:6px;">
                            <p style="font-weight:800; color:var(--accent-blue); margin:0 0 6px 0; font-size:0.85rem;">TEAM A (${teamA.length}/5)</p>
                            <ol style="font-size:0.8rem; padding-left:16px; margin:0; line-height:1.4;">${teamA.map(p => renderPlayerItem(p)).join('')}</ol>
                        </div>
                        <div style="background:#1e293b; padding:8px; border-radius:6px;">
                            <p style="font-weight:800; color:var(--accent-red); margin:0 0 6px 0; font-size:0.85rem;">TEAM B (${teamB.length}/5)</p>
                            <ol style="font-size:0.8rem; padding-left:16px; margin:0; line-height:1.4;">${teamB.map(p => renderPlayerItem(p)).join('')}</ol>
                        </div>
                    </div>

                    ${adminPickerHtml}
                `;
                container.appendChild(card);
            }
        }

        window.addPlayerToTeam = async (gameNum, name, position, teamLetter) => {
            if (!isAdminUser) return;
            const gameKey = `game_${gameNum}`;
            let currentData = customMatchesData[gameKey] || { teamA: [], teamB: [] };

            // Remove from both teams first to prevent duplicates
            currentData.teamA = currentData.teamA.filter(p => p.name !== name);
            currentData.teamB = currentData.teamB.filter(p => p.name !== name);

            if (teamLetter === 'A') {
                if (currentData.teamA.length >= 5) return alert("Team A is already full (5 players)!");
                currentData.teamA.push({ name, position });
            } else {
                if (currentData.teamB.length >= 5) return alert("Team B is already full (5 players)!");
                currentData.teamB.push({ name, position });
            }

            await setDoc(doc(db, "settings", "custom_matches"), {
                [`game_${gameNum}`]: currentData
            }, { merge: true });
        };

        window.addManualPlayer = async (gameNum, teamLetter) => {
            if (!isAdminUser) return;
            const input = document.getElementById(`custom-borrow-${gameNum}`);
            const name = input.value.trim();
            if (!name) return;

            await window.addPlayerToTeam(gameNum, name, 'BORROWED', teamLetter);
            input.value = "";
        };

        window.removePlayerFromGame = async (gameNum, name) => {
            if (!isAdminUser) return;
            const gameKey = `game_${gameNum}`;
            let currentData = customMatchesData[gameKey] || { teamA: [], teamB: [] };

            currentData.teamA = currentData.teamA.filter(p => p.name !== name);
            currentData.teamB = currentData.teamB.filter(p => p.name !== name);

            await setDoc(doc(db, "settings", "custom_matches"), {
                [`game_${gameNum}`]: currentData
            }, { merge: true });
        };

        window.setAttendance = async (status) => {
            const u = auth.currentUser;
            if (!u) return;
            await updateDoc(doc(db, "users", u.uid), { status });
            alert(status === 'in' ? "Checked in successfully!" : "Canceled status.");
        };

        window.handleSignup = async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const userData = {
                uid: user.uid,
                name: user.displayName || document.getElementById('reg-name').value,
                email: user.email,
                height: document.getElementById('reg-h').value,
                position: document.getElementById('reg-p').value,
                status: 'out',
                isPaid: false,
                isApproved: user.email === SUPER_ADMIN_EMAIL,
                isBanned: false
            };

            await setDoc(doc(db, "users", user.uid), userData);
            checkUserStatus(user);
        };
    </script>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="login-page" class="page">
        <div class="card" style="text-align: center; max-width: 400px; margin: 40px auto;">
            <h2>BASKETBALL CLUB</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Admin Game Set Builder</p>
            <button class="btn-main" style="width: 100%; margin-top: 12px;" onclick="loginWithGoogle()">Sign in with Google</button>
        </div>
    </div>

    <!-- PENDING PAGE -->
    <div id="pending-approval-page" class="page hidden">
        <div class="card" style="text-align: center; max-width: 400px; margin: 40px auto;">
            <h3 style="color: #facc15;">Pending Approval</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Please wait for an Admin to approve your account.</p>
            <button class="btn-outline" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <!-- SIGNUP PAGE -->
    <div id="signup-page" class="page hidden">
        <div class="card" style="max-width: 400px; margin: 20px auto;">
            <h3>Setup Profile</h3>
            <form onsubmit="handleSignup(event)">
                <input type="text" id="reg-name" placeholder="Full Name" required style="width:100%; margin-bottom:8px; padding:6px;">
                <input type="text" id="reg-h" placeholder="Height (e.g. 5'10)" required style="width:100%; margin-bottom:8px; padding:6px;">
                <select id="reg-p" required style="width:100%; margin-bottom:12px; padding:6px;">
                    <option value="">Select Position...</option>
                    <option>Point Guard (PG)</option>
                    <option>Shooting Guard (SG)</option>
                    <option>Small Forward (SF)</option>
                    <option>Power Forward (PF)</option>
                    <option>Center (C)</option>
                </select>
                <button type="submit" class="btn-main" style="width:100%;">Save</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboard-page" class="page hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2>Basketball League Dashboard</h2>
            <button class="btn-outline" onclick="logout()">Sign Out</button>
        </div>

        <div class="card">
            <h3>Player Check-In</h3>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="btn-main" style="flex:1;" onclick="setAttendance('in')">I WILL PLAY (IN)</button>
                <button class="btn-outline" style="flex:1; color:#f87171; border-color:#f87171;" onclick="setAttendance('out')">OUT</button>
            </div>
        </div>

        <!-- Realtime Game Sets -->
        <h3>Game Sets (Admin Managed)</h3>
        <div id="generated-matches"></div>

        <!-- Attending Roster -->
        <div class="card">
            <h3>Attending Players Pool</h3>
            <ul id="active-roster-list" style="padding:0; margin:0; list-style:none;"></ul>
        </div>
    </div>

</body>
</html>
