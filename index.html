<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baller System - Matchmaking & Management</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .tag {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .badge-paid {
            background: #22c55e;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .badge-unpaid {
            background: #ef4444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .btn-main {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- View Time Header -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2>Baller System Roster</h2>
            <span id="view-time" style="font-weight:bold; color:var(--accent-blue);">6:00 PM</span>
        </div>

        <!-- Generated Matches Section -->
        <h3>Game Sets & Matchmaking</h3>
        <div id="generated-matches"></div>

        <!-- Active Roster Section -->
        <h3>Checked-In Roster</h3>
        <ul id="active-roster-list" style="padding:0;"></ul>

        <!-- Admin User Management Panel -->
        <div id="admin-panel" style="margin-top:24px;">
            <h3>Admin User Management</h3>
            <div id="admin-user-list"></div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "ballerapp-61517.firebaseapp.com",
            projectId: "ballerapp-61517",
            storageBucket: "ballerapp-61517.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const SUPER_ADMIN_EMAIL = "superadmin@gmail.com"; 
        const DEFAULT_GUEST_AVATAR = "https://via.placeholder.com/150";

        let isAdminUser = false;
        let globalAttendingPool = [];
        let customMatchesData = {};

        // Helper Position Abbreviation
        function getAbbrPos(pos) {
            if (!pos) return '[GUEST]';
            if (pos.toLowerCase().includes('point')) return '[PG]';
            if (pos.toLowerCase().includes('shooting')) return '[SG]';
            if (pos.toLowerCase().includes('small')) return '[SF]';
            if (pos.toLowerCase().includes('power')) return '[PF]';
            if (pos.toLowerCase().includes('center')) return '[C]';
            return `[${pos.toUpperCase()}]`;
        }

        // Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    const currentUserData = userSnap.data();

                    // Bypass restriction for Super Admin
                    if (currentUserData.isBanned && user.email !== SUPER_ADMIN_EMAIL) {
                        alert("ACCOUNT RESTRICTED: " + (currentUserData.banReason || "Violated club policies."));
                        signOut(auth);
                        return;
                    }

                    isAdminUser = currentUserData.isAdmin || user.email === SUPER_ADMIN_EMAIL;
                }
            }
        });

        // Listen for Custom Admin Overrides for Game Sets
        onSnapshot(doc(db, "settings", "custom_matches"), (snapshot) => {
            if (snapshot.exists()) {
                customMatchesData = snapshot.data();
            } else {
                customMatchesData = {};
            }
            renderRosterAndMatchmaking(globalAttendingPool);
        });

        // Listen for Realtime Users & Roster
        onSnapshot(collection(db, "users"), (snapshot) => {
            let users = [];
            globalAttendingPool = [];

            snapshot.forEach(docSnap => {
                let data = docSnap.data();
                data.uid = docSnap.id;
                users.push(data);

                if (data.status === 'in') {
                    globalAttendingPool.push(data);
                }
            });

            renderAdminUserManagement(users);
            renderRosterAndMatchmaking(globalAttendingPool);
        });

        // Render Roster & Matchmaking Sets
        function renderRosterAndMatchmaking(pool) {
            const rosterList = document.getElementById('active-roster-list');
            if (rosterList) {
                rosterList.innerHTML = pool.length === 0 ? `<li style="color:var(--text-muted); list-style:none;">No players checked in yet.</li>` :
                    pool.map(p => `
                        <li style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <img src="${p.photoURL || DEFAULT_GUEST_AVATAR}" style="width:28px; height:28px; border-radius:50%; object-fit:cover;">
                                <span><strong>${p.name}</strong> - <span style="color:var(--text-muted);">${p.position || 'N/A'}</span></span>
                            </div>
                            ${p.isPaid ? `<span class="badge-paid">PAID</span>` : `<span class="badge-unpaid">UNPAID</span>`}
                        </li>
                    `).join('');
            }

            const matchesContainer = document.getElementById('generated-matches');
            if (!matchesContainer) return;
            matchesContainer.innerHTML = "";

            if (pool.length < 5 && Object.keys(customMatchesData).length === 0) {
                matchesContainer.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">Waiting for at least 5 players to form a game set. (Current Count: ${pool.length})</p>`;
                return;
            }

            let gameNumber = 1;
            let currentPool = [...pool];
            let initialPoolForBorrowing = [...pool];

            let startTimeStr = document.getElementById('view-time') ? document.getElementById('view-time').innerText : "6:00 PM";
            let baseMinutes = 19 * 60; 
            if (startTimeStr.includes("6")) baseMinutes = 18 * 60;

            while (currentPool.length > 0 || customMatchesData[`game_${gameNumber}`]) {
                let currentGamePlayers = [];

                if (currentPool.length >= 10) {
                    currentGamePlayers = currentPool.slice(0, 10);
                    currentPool = currentPool.slice(10);
                } else if (currentPool.length > 0) {
                    currentGamePlayers = [...currentPool];
                    let neededCount = 10 - currentGamePlayers.length;
                    let availableForBorrow = initialPoolForBorrowing.filter(p => !currentGamePlayers.some(cp => cp.name === p.name));
                    let borrowedPlayers = availableForBorrow.slice(0, neededCount);

                    currentGamePlayers = [...currentGamePlayers, ...borrowedPlayers];
                    currentPool = [];
                }

                let teamA = currentGamePlayers.slice(0, 5);
                let teamB = currentGamePlayers.slice(5, 10);

                const customGameKey = `game_${gameNumber}`;
                if (customMatchesData[customGameKey]) {
                    if (customMatchesData[customGameKey].teamA) teamA = customMatchesData[customGameKey].teamA;
                    if (customMatchesData[customGameKey].teamB) teamB = customMatchesData[customGameKey].teamB;
                }

                let matchStartMins = baseMinutes + (gameNumber - 1) * 45;
                let startHH = Math.floor(matchStartMins / 60);
                let startMM = matchStartMins % 60;
                let timeFormatted = `${startHH % 12 || 12}:${startMM < 10 ? '0' : ''}${startMM} ${startHH >= 12 ? 'PM' : 'AM'}`;

                const renderPlayerWithPos = (p) => {
                    const nameStr = typeof p === 'string' ? p : (p.name || "Player");
                    const posStr = p.position ? getAbbrPos(p.position) : '[GUEST]';
                    return `<li><strong>${nameStr}</strong> <span style="font-size:0.75rem; color:#60a5fa; font-weight:600;">${posStr}</span></li>`;
                };

                let card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #334155; padding-bottom:6px;">
                        <span class="tag">GAME ${gameNumber}</span>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-weight:700; color:var(--accent-blue); font-size:0.8rem;">Est: ${timeFormatted}</span>
                            ${isAdminUser ? `<button onclick="editGameSetRoster(${gameNumber}, '${encodeURIComponent(JSON.stringify(teamA))}', '${encodeURIComponent(JSON.stringify(teamB))}')" style="background:#2563eb; color:#fff; border:none; padding:2px 8px; border-radius:4px; font-size:0.75rem; cursor:pointer; font-weight:bold;">[Admin Edit Set]</button>` : ''}
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div style="background:#1e293b; padding:8px; border-radius:6px;">
                            <p style="font-weight:800; color:var(--accent-blue); margin:0 0 4px 0; font-size:0.85rem;">TEAM A</p>
                            <ol style="font-size:0.8rem; padding-left:14px; margin:0; line-height:1.4;">${teamA.map(p => renderPlayerWithPos(p)).join('')}</ol>
                        </div>
                        <div style="background:#1e293b; padding:8px; border-radius:6px;">
                            <p style="font-weight:800; color:#f87171; margin:0 0 4px 0; font-size:0.85rem;">TEAM B</p>
                            <ol style="font-size:0.8rem; padding-left:14px; margin:0; line-height:1.4;">${teamB.map(p => renderPlayerWithPos(p)).join('')}</ol>
                        </div>
                    </div>
                `;
                matchesContainer.appendChild(card);

                gameNumber++;
                if (gameNumber > 8) break;
            }
        }

        // Render Admin User List with Working Edit Button
        function renderAdminUserManagement(users) {
            const container = document.getElementById('admin-user-list');
            if (!container) return;
            container.innerHTML = "";

            users.forEach(u => {
                if (u.email === SUPER_ADMIN_EMAIL) return;

                let paymentBadge = `<span style="background:#64748b; color:#fff; padding:2px 6px; border-radius:4px; font-size:0.7rem; font-weight:bold;">N/A</span>`;
                if (u.status === 'in') {
                    paymentBadge = u.isPaid ? `<span class="badge-paid">PAID</span>` : `<span class="badge-unpaid">UNPAID</span>`;
                }

                let card = document.createElement('div');
                card.style.cssText = "background:#0f172a; padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid var(--card-border);";
                card.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <img src="${u.photoURL || DEFAULT_GUEST_AVATAR}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
                                <div>
                                    <p style="font-weight:700; margin:0; font-size:0.85rem;">${u.name || 'User'} <span style="font-size:0.7rem; color:var(--text-muted);">(${u.email})</span></p>
                                    <p style="font-size:0.75rem; color:var(--text-muted); margin:0;">${u.position || 'N/A'} | ${u.height || "N/A"} | Status: <strong style="color:${u.status === 'in' ? '#4ade80' : '#f87171'};">${u.status ? u.status.toUpperCase() : 'OUT'}</strong></p>
                                </div>
                            </div>
                            <div>${paymentBadge}</div>
                        </div>
                        <div style="display:flex; gap:4px; flex-wrap:wrap;">
                            <button class="btn-outline" style="padding:3px 6px; font-size:0.7rem;" onclick="adminEditUserProfile('${u.uid}')">Edit</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Global Edit Functions attached to window scope
        window.editGameSetRoster = async (gameNum, currentTeamAEnc, currentTeamBEnc) => {
            if (!isAdminUser) {
                alert("Only Admins and Super Admins are allowed to edit match sets.");
                return;
            }

            let currentTeamA = JSON.parse(decodeURIComponent(currentTeamAEnc));
            let currentTeamB = JSON.parse(decodeURIComponent(currentTeamBEnc));

            let namesA = currentTeamA.map(p => typeof p === 'string' ? p : p.name);
            let namesB = currentTeamB.map(p => typeof p === 'string' ? p : p.name);

            let posLookup = {};
            globalAttendingPool.forEach(p => {
                posLookup[p.name] = p.position;
            });

            let promptMsg = `[GAME ${gameNum} EDIT SET]\n\nAttending Players:\n${globalAttendingPool.map(p => `${p.name} (${p.position || 'N/A'})`).join(', ')}\n\nI-type ang pangalan ng TEAM A (comma separated):`;

            let teamAStr = prompt(promptMsg, namesA.join(', '));
            if (teamAStr === null) return;

            let teamBStr = prompt(`[GAME ${gameNum}] I-type ang pangalan ng TEAM B (comma separated):`, namesB.join(', '));
            if (teamBStr === null) return;

            const teamAArray = teamAStr.split(',').map(s => {
                let name = s.trim();
                return { name: name, position: posLookup[name] || "BORROWED" };
            }).filter(p => p.name.length > 0);

            const teamBArray = teamBStr.split(',').map(s => {
                let name = s.trim();
                return { name: name, position: posLookup[name] || "BORROWED" };
            }).filter(p => p.name.length > 0);

            await setDoc(doc(db, "settings", "custom_matches"), {
                [`game_${gameNum}`]: { teamA: teamAArray, teamB: teamBArray }
            }, { merge: true });

            alert(`Game ${gameNum} roster updated! Na-save na sa database.`);
        };

        window.adminEditUserProfile = async (uid) => {
            const userDocRef = doc(db, "users", uid);
            const userSnap = await getDoc(userDocRef);

            if (!userSnap.exists()) {
                alert("User not found!");
                return;
            }

            const userData = userSnap.data();

            const newName = prompt("Edit Player Name:", userData.name || "");
            if (newName === null) return;

            const newHeight = prompt("Edit Height (ft'in\"): ", userData.height || "");
            if (newHeight === null) return;

            const newPosition = prompt("Edit Position:", userData.position || "");
            if (newPosition === null) return;

            await updateDoc(userDocRef, {
                name: newName,
                height: newHeight,
                position: newPosition
            });

            alert("Player profile updated successfully!");
        };
    </script>
</body>
</html>
